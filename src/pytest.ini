[pytest]
DJANGO_SETTINGS_MODULE = src.settings
pythonpath = .

# atlas/trails/tenancy were added with the Madeira tenants. The suites already existed, but a
# bare `manage.py test` never collected them, so the tenant-isolation, importer-ownership and
# trail-provider tests were written and then never run by default.
#
# marketplace/tests and seismic/tests stay out: each has one failure that predates this change
# (an Island the 0017 seed already creates, and a seismic time-window assertion).
testpaths =
    tests
    weather/tests
    transit/tests
    azoresbus/tests
    shared/tests
    app/tests
    assistant/tests
    mcp_server/tests
    legal
    atlas/tests
    trails/tests
    tenancy/tests
python_files = test_*.py tests.py
python_classes = Test* *Tests
python_functions = test_*
