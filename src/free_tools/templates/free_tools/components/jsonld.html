{% if tool %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "{{ tool.name|escapejs }}",
  "description": "{{ tool.meta_description|default:tool.tagline|escapejs }}",
  "url": "{{ PROJECT_URL }}{{ tool.get_absolute_url }}",
  "applicationCategory": "Utility",
  "operatingSystem": "All",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  },
  "provider": {
    "@type": "Organization",
    "name": "{{ PROJECT_NAME|escapejs }}"
  },
  "inLanguage": "{{ tool.language }}"
}
</script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type": "ListItem", "position": 1, "name": "Home", "item": "{{ PROJECT_URL }}/"},
    {"@type": "ListItem", "position": 2, "name": "Free Tools", "item": "{{ PROJECT_URL }}/tools/"}{% if tool.category %},
    {"@type": "ListItem", "position": 3, "name": "{{ tool.category.name|escapejs }}", "item": "{{ PROJECT_URL }}{{ tool.category.get_absolute_url }}"},
    {"@type": "ListItem", "position": 4, "name": "{{ tool.name|escapejs }}"}{% else %},
    {"@type": "ListItem", "position": 3, "name": "{{ tool.name|escapejs }}"}{% endif %}
  ]
}
</script>
{% endif %}
